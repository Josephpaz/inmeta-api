name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: 'postgresql://inmeta:inmeta@localhost:5432/inmeta_api_test?schema=public'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inmeta
          POSTGRES_PASSWORD: inmeta
          POSTGRES_DB: inmeta_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inmeta -d inmeta_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run test

      - run: npm run test:e2e
