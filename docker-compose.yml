services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inmeta
      POSTGRES_PASSWORD: inmeta
      POSTGRES_DB: inmeta_api
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inmeta -d inmeta_api']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
